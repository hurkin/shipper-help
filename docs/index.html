<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShipperXL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* No sidebar when framed (shipper-ui's help panel) or asked with ?sidebar=0 */
    body.no-sidebar .sidebar,
    body.no-sidebar .sidebar-toggle { display: none; }
    body.no-sidebar .content { left: 0; transform: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="search-paths.js"></script>
  <script>
    // Docsify search reuses its cached index until it expires, whatever pages
    // were added since. Drop it whenever build-index.py's version changes, and
    // the old un-namespaced index (built from one section's sidebar).
    try {
      if (localStorage.getItem('shipper-help.search.version') !== window.SEARCH_VERSION) {
        localStorage.removeItem('docsify.search.expires/shipper-help');
        localStorage.setItem('shipper-help.search.version', window.SEARCH_VERSION);
      }
      localStorage.removeItem('docsify.search.index');
      localStorage.removeItem('docsify.search.expires');
    } catch (e) {}
  </script>
  <script>
    // Framed pages (shipper-ui's help panel) never show the sidebar. Elsewhere,
    // ?sidebar=0 hides it, before the # or in the route
    // (#/context/I001?sidebar=0), and it stays hidden as links are followed.
    var framed = (function () {
      try { return window.self !== window.top; } catch (e) { return true; }
    })();
    var sidebarOff = framed || /[?&]sidebar=(0|false|hide)\b/i.test(location.search);

    window.$docsify = {
      name: 'ShipperXL',
      repo: 'hurkin/shipper-help',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,
      // Every page, not just the sidebar on screen (scripts/build-index.py).
      // An hour's cache picks up edits made without rerunning the script.
      search: {
        paths: window.SEARCH_PATHS || 'auto',
        namespace: 'shipper-help',
        maxAge: 3600000
      },
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (content) {
            var s = String((vm.route.query || {}).sidebar || '').toLowerCase();
            if (s === '0' || s === 'false' || s === 'hide') sidebarOff = true;
            document.body.classList.toggle('no-sidebar', sidebarOff);
            return content;
          });
        },
        // Obsidian image embeds: ![[mobile-menu.png]], ![[queue.png|Queue]] (alt
        // text), ![[queue.png|400]] or ![[queue.png|400x300]] (size). A bare file
        // name is in docs/assets/. Written as <img> so the path resolves against
        // the site root whichever folder the page is in. Code blocks are skipped.
        function (hook) {
          function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
          }
          function embed(m, target, opt) {
            var file = target.trim();
            var src = file.indexOf('/') < 0 ? 'assets/' + file : file.replace(/^\.?\//, '');
            var alt = file.replace(/^.*\//, '').replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
            var size = '';
            opt = (opt || '').trim();
            var dims = /^(\d+)(?:x(\d+))?$/.exec(opt);
            if (dims) {
              size = ' width="' + dims[1] + '"' + (dims[2] ? ' height="' + dims[2] + '"' : '');
            } else if (opt) {
              alt = opt;
            }
            return '<img src="' + esc(encodeURI(src)) + '" alt="' + esc(alt) + '"' + size + '>';
          }
          hook.beforeEach(function (content) {
            return content.split(/(^```[\s\S]*?^```|`[^`\n]*`)/m).map(function (part, i) {
              return i % 2 ? part : part.replace(/!\[\[([^\]|]+)(?:\|([^\]]*))?\]\]/g, embed);
            }).join('');
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
</body>
</html>
